commands:
  # Gate commands run under a non-interactive /bin/sh that never sources a shell
  # profile, so a Node provisioned by fnm is missing from PATH and every
  # `npm run ...` here exits 127 with "npm: not found". Prepending fnm's
  # default-alias bin restores npm where fnm is installed, and is a no-op
  # anywhere else because a PATH entry that does not exist is simply skipped.
  #
  # What that gate is stays in package.json rather than here, so this file and
  # the repository's own hooks cannot come to disagree about what a check means.
  lint: >-
    export PATH="$HOME/.local/share/fnm/aliases/default/bin:$PATH";
    npm run quality:static

ignore_patterns:
  - ".claude/skills/stepstone/SKILL.md"
  - "docs/cli.md"
  - "docs/ROADMAP.md"
