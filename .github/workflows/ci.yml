name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: git --version
      - run: npm run check
      # Audit the shipped production tree only: the dev/peer tree pins a known
      # brace-expansion finding via @earendil-works/pi-coding-agent's published
      # npm-shrinkwrap.json, which is not fixable locally (earendil-works/pi#7090).
      - run: npm audit --omit=dev --omit=peer --audit-level=high
      - run: npm run pack:check

  mutation-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: npm run test:mutation

  # Published executables promise to work with nothing installed but Node, and
  # this checkout cannot test that directly: it has every Pi peer present as a
  # devDependency, so a leaked import resolves here and breaks only for users.
  # This job packs the publishable tarball, installs it alone with no Pi present,
  # and drives every released bin across its surface. It waits on `check`, whose
  # fast source-level import scan reports the same regression in milliseconds
  # and with a clearer message.
  no-pi-install:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: npm run no-pi-install:check

  # Standalone: npm pack rebuilds dist and must not race Vitest's pack tests.
  published-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: published-e2e-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/e2e/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  authoritative-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: service-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      STEPSTONE_TEST_DATABASE_URL: postgresql://postgres:service-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: npm run test:service -- --coverage
      - run: npm run test:service:operations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authoritative-service-evidence
          path: |
            artifacts/service-operations.json
            artifacts/service-coverage/
          retention-days: 14
          if-no-files-found: error
