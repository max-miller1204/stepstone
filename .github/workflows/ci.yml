name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run check
      # Audit the shipped production tree only: the dev/peer tree pins a known
      # brace-expansion finding via @earendil-works/pi-coding-agent's published
      # npm-shrinkwrap.json, which is not fixable locally (earendil-works/pi#7090).
      - run: npm audit --omit=dev --omit=peer --audit-level=high
      - run: npm run pack:check

  # Both bins promise that `npx stepstone` and `stepstone-mcp` work with nothing
  # installed but Node, and this checkout cannot test that: it has every Pi peer
  # present as a devDependency, so a leaked import resolves here and breaks only
  # for users. This job packs the publishable tarball, installs it alone with no
  # Pi present, and drives every released bin across its surface. It waits on
  # `check`, whose fast source-level import scan reports the same regression in
  # milliseconds and with a clearer message.
  no-pi-install:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run no-pi-install:check
