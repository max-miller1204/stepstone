name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: git --version && gh --version
      - run: npm run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: process-boundary-evidence-${{ matrix.os }}
          path: artifacts/process-boundaries/
          include-hidden-files: true
          if-no-files-found: ignore
      # Audit the shipped production tree only: the dev/peer tree pins a known
      # brace-expansion finding via @earendil-works/pi-coding-agent's published
      # npm-shrinkwrap.json, which is not fixable locally (earendil-works/pi#7090).
      - run: npm audit --omit=dev --omit=peer --audit-level=high
      - run: npm run pack:check

  mutation-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: npm run test:mutation

  # Keep the declared minimum and current LTS covered independently of Pi's
  # newer development runtime requirement. These tests use real Git and gh;
  # their subprocess fixture is compiled before running on either Node version.
  workspace-preparation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: node --version && git --version && gh --version
      - run: npm run test:boundaries
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: workspace-preparation-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/process-boundaries/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  # Published executables promise to work with nothing installed but Node, and
  # this checkout cannot test that directly: it has every Pi peer present as a
  # devDependency, so a leaked import resolves here and breaks only for users.
  # This job packs the publishable tarball, installs it alone with no Pi present,
  # and drives every released bin across its surface. It waits on `check`, whose
  # fast source-level import scan reports the same regression in milliseconds
  # and with a clearer message.
  no-pi-install:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: npm run no-pi-install:check

  # Standalone: npm pack rebuilds dist and must not race Vitest's pack tests.
  published-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: published-e2e-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/e2e/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
