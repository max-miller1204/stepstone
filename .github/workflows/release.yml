name: Release

# Publishing is driven entirely by tags: pushing v1.2.3 publishes 1.2.3.
# Commits and merges to main never reach this workflow, so the existing
# `npm version <bump> && git push --follow-tags` flow is unchanged - only the
# manual `npm publish` step moves into CI.
on:
  push:
    tags:
      - "v*.*.*"

# No NPM_TOKEN: npm authenticates this workflow over OIDC via Trusted
# Publishing, which also attaches build provenance to the published tarball.
# `contents: write` is what lets the last step create the GitHub Release.
permissions:
  id-token: write
  contents: write

# Never let two publishes for the same tag run at once, and never cancel one
# midway - a half-finished publish is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: service-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      STEPSTONE_TEST_DATABASE_URL: postgresql://postgres:service-test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      # Deliberately no `registry-url`. It makes setup-node write an .npmrc
      # holding `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, and npm
      # treats that as configured credentials even when the variable is unset -
      # so it skips the OIDC exchange entirely and publishes with an empty
      # token, which the registry rejects as a 404. Leaving it out is what lets
      # trusted publishing engage.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Trusted Publishing requires npm >= 11.5.1, which is newer than the npm
      # bundled with some Node 24 releases.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # Guards against tagging v0.15.0 while package.json still says 0.14.0,
      # which would otherwise publish the wrong version under the right tag.
      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag_version, but package.json is $pkg_version"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version $pkg_version"

      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json

      # Same gates as CI, re-run against the exact commit being published so a
      # green tag cannot outrun a red main.
      - run: npm run verify

      # The tarball about to be published is packed, installed with no Pi peers
      # and no dev dependencies, and driven end to end. `verify` cannot see this
      # failure: it runs against a checkout where every peer is installed.
      - run: npm run no-pi-install:check

      - run: npm run test:service -- --coverage
      - run: npm run test:service:operations

      - run: npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
