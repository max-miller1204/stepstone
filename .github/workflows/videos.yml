name: PR video verification

on:
  pull_request:
    paths:
      - scripts/videos/**
      - .github/workflows/videos.yml
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario name, or all
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  videos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VIDEO_SCENARIO: ${{ inputs.scenario || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install repository dependencies
        run: cp npm-shrinkwrap.json package-lock.json && npm ci --ignore-scripts && rm package-lock.json
      - name: Test scenario contract
        run: npm run videos:test
      - name: Verify actual commands without recording
        run: npm run videos:check -- "$VIDEO_SCENARIO"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: evidence
        if: always()
        with:
          name: stepstone-video-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/videos/**/metadata.json
            artifacts/videos/**/commands.jsonl
            artifacts/videos/**/process.log
            artifacts/videos/**/failure.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Link evidence in the check summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          if [ -n "$ARTIFACT_URL" ]; then
            printf '## Video scenario verification\n\n[Download verification logs](%s)\n\nRender and review the MP4 locally before attaching it to the PR.\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
