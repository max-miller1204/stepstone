---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pi:
        patterns:
          - "@earendil-works/pi-*"
          - typebox
        update-types:
          - minor
          - patch
      # Everything outside the pi group would otherwise open one PR per package.
      # Batch the routine dev bumps into a single PR; majors stay ungrouped so
      # they arrive individually and get reviewed on their own merits.
      dev-deps:
        dependency-type: development
        exclude-patterns:
          - "@earendil-works/pi-*"
          - typebox
        update-types:
          - minor
          - patch
